apiVersion: 1

providers:
  - name: 'observability-tier-dashboards'
    orgId: 1
    folder: 'Observability'
    folderUid: 'observability'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
