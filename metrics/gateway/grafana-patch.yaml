apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  hostnames:
  - grafana.prakriti.website
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-gateway-tls
  namespace: gateway-system
spec:
  commonName: grafana.prakriti.website
  dnsNames:
  - grafana.prakriti.website
