apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-gateway-tls
  namespace: gateway-system
spec:
  commonName: prometheus.prakriti.website
  dnsNames:
  - prometheus.prakriti.website
  secretName: prometheus-tls-secret
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
