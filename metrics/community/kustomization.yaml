apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../gateway
  - gateway-components

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: default-gateway
      namespace: gateway-system
    path: gateway-components/prometheus-gateway-patch.yaml
