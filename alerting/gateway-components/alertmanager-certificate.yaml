apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alertmanager-gateway-tls
  namespace: gateway-system
spec:
  commonName: alertmanager.prakriti.website
  dnsNames:
  - alertmanager.prakriti.website
  secretName: alertmanager-tls-secret
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
