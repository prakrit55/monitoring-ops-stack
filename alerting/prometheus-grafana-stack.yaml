prometheus:
  enabled: true
  prometheusSpec:
    enableRemoteWriteReceiver: true
    enableFeatures:
      - exemplar-storage
      - native-histograms

grafana:
  enabled: true
  service:
    type: ClusterIP

  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true

# Keep resource footprint light by disabling optional stack components
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-secrets
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
      routes:
      - match:
          severity: critical
        receiver: 'pagerduty-notifications'
        continue: true
      - match:
          severity: warning
        receiver: 'slack-notifications'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#alerts'
        api_url_file: '/etc/alertmanager/secrets/alertmanager-secrets/slack-webhook-url'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Monitoring Alert'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}
    - name: 'pagerduty-notifications'
      pagerduty_configs:
      - service_key_file: '/etc/alertmanager/secrets/alertmanager-secrets/pagerduty-service-key'
        send_resolved: true



nodeExporter:
  enabled: true

prometheus-node-exporter:
  enabled: false

kubeStateMetrics:
  enabled: true
