global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: 'local-dev'
    environment: 'development'

rule_files:
  - '/etc/prometheus/rules/recording_rules.yml'
  - '/etc/prometheus/rules/alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Synthetic Mock Metrics Generator (service-a, service-b, service-c, service-d)
  - job_name: 'mock-metrics'
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets: ['mock-metrics:8080']

  # Real Production Microservices
  - job_name: 'ecommerce-ui'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ecommerce-ui:4000']

  - job_name: 'product-catalog'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['product-catalog:3001']

  - job_name: 'product-inventory'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['product-inventory:3002']

  - job_name: 'shipping-and-handling'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['shipping-and-handling:8080']

  - job_name: 'contact-support-team'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['contact-support-team:8000']

  - job_name: 'order-management'
    scrape_interval: 10s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-management:9090']
