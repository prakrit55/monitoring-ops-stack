[SERVICE]
    Daemon          Off
    Flush           1
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On

# Collect logs forwarded by Docker daemon log driver or fluent-cat
[INPUT]
    Name            forward
    Listen          0.0.0.0
    Port            24224
    Tag             docker.*

# Generate sample periodic logs for demonstration & immediate testing
[INPUT]
    Name            dummy
    Tag             demo.logs
    Dummy           {"message": "Synthetic heartbeat log from Fluent Bit", "service": "fluent-bit-demo", "level": "info"}
    Rate            2

# Ingest Docker container logs if container log directory is mounted
[INPUT]
    Name            tail
    Path            /var/lib/docker/containers/*/*.log
    Parser          docker
    Tag             docker.containers.*
    Mem_Buf_Limit   50MB
    Skip_Long_Lines On
    Refresh_Interval 10

# Route all logs to Grafana Loki
[OUTPUT]
    Name            loki
    Match           *
    Host            loki
    Port            3100
    URI             /loki/api/v1/push
    Labels          job=fluent-bit, environment=docker-compose
    Auto_Kubernetes_Labels off
