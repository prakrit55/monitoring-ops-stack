[SERVICE]
    Daemon          Off
    Flush           1
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On

# -------------------------------------------------------------------------
# INPUTS
# -------------------------------------------------------------------------

# Ingest container logs directly from Docker log files
[INPUT]
    Name            tail
    Path            /var/lib/docker/containers/*/*-json.log
    Parser          docker
    Tag             docker.*
    Mem_Buf_Limit   50MB
    Skip_Long_Lines On
    Refresh_Interval 10

# Forward port for containers using Docker log-driver or direct fluent-cat
[INPUT]
    Name            forward
    Listen          0.0.0.0
    Port            24224
    Tag             forward.*

# -------------------------------------------------------------------------
# FILTERS: Container ID & Metadata Extraction
# -------------------------------------------------------------------------

# Extract the 12-char container ID from the file path
[FILTER]
    Name            record_modifier
    Match           docker.*
    Record          host 172.31.3.1

# If application logs are emitted as JSON, unpack the nested "log" field
[FILTER]
    Name            parser
    Match           docker.*
    Key_Name        log
    Parser          json
    Reserve_Data    On
    Preserve_Key    On

# -------------------------------------------------------------------------
# FILTERS: Prometheus Metric Label Normalization
# Map each container to the EXACT `job` name used in prometheus.yml
# -------------------------------------------------------------------------

# 1. ecommerce-ui
[FILTER]
    Name            rewrite_tag
    Match           docker.*
    Rule            $tag ^.*ecommerce-ui.*$ app.ecommerce-ui false
    Rule            $attrs['tag'] ^.*ecommerce-ui.*$ app.ecommerce-ui false

# 2. product-catalog
[FILTER]
    Name            rewrite_tag
    Match           docker.*
    Rule            $tag ^.*product-catalog.*$ app.product-catalog false
    Rule            $attrs['tag'] ^.*product-catalog.*$ app.product-catalog false

# 3. product-inventory
[FILTER]
    Name            rewrite_tag
    Match           docker.*
    Rule            $tag ^.*product-inventory.*$ app.product-inventory false
    Rule            $attrs['tag'] ^.*product-inventory.*$ app.product-inventory false

# 4. shipping-and-handling
[FILTER]
    Name            rewrite_tag
    Match           docker.*
    Rule            $tag ^.*shipping-handling.*$ app.shipping-and-handling false
    Rule            $attrs['tag'] ^.*shipping-handling.*$ app.shipping-and-handling false

# 5. contact-support
[FILTER]
    Name            rewrite_tag
    Match           docker.*
    Rule            $tag ^.*contact-support.*$ app.contact-support false
    Rule            $attrs['tag'] ^.*contact-support.*$ app.contact-support false

# 6. order-management
[FILTER]
    Name            rewrite_tag
    Match           docker.*
    Rule            $tag ^.*order-management.*$ app.order-management false
    Rule            $attrs['tag'] ^.*order-management.*$ app.order-management false

# -------------------------------------------------------------------------
# OUTPUTS: Stream directly to Grafana Loki
# -------------------------------------------------------------------------

# Forward routed microservice logs with dynamic Prometheus job labeling
[OUTPUT]
    Name            loki
    Match           app.*
    Host            loki
    Port            3100
    URI             /loki/api/v1/push
    Labels          job=$TAG[1], environment=production
    Line_Format     json
    Auto_Kubernetes_Labels off

# Catch-all fallback for non-app containers (redis, mongo, postgres, fluent-bit)
[OUTPUT]
    Name            loki
    Match           docker.*
    Host            loki
    Port            3100
    URI             /loki/api/v1/push
    Labels          job=infrastructure, environment=production
    Line_Format     json
    Auto_Kubernetes_Labels off
