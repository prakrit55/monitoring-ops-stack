apiVersion: 1

providers:
  - name: "Kubernetes Dashboards"
    orgId: 1
    folder: "Kubernetes Monitoring"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/dashboards/json

  - name: "Observability Tier Dashboards"
    orgId: 1
    folder: "Observability Tiers"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/dashboards/tier-json
