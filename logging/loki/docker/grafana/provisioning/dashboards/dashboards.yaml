apiVersion: 1

providers:
  - name: "Observability Dashboards"
    orgId: 1
    folder: "Kubernetes Monitoring"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards/json
      foldersFromFilesStructure: true
