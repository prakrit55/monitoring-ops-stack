global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service', 'namespace', 'tier']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'slack-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-notifications'
      continue: true
    - match:
        severity: warning
      receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#monitoring-alerts'
        send_resolved: true
        api_url: 'http://localhost:9093/dummy-slack-webhook'
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.tier | toUpper }} Alert'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
            *Description:* {{ .Annotations.description }}
            *Tier:* `{{ .Labels.tier }}`
            {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}

  - name: 'pagerduty-notifications'
    pagerduty_configs:
      - routing_key: '00000000000000000000000000000000'
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        details:
          tier: '{{ .CommonLabels.tier }}'
          severity: '{{ .CommonLabels.severity }}'
          runbook: '{{ .CommonAnnotations.runbook_url }}'
