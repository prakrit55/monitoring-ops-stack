global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "fluent-bit"
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]

  - job_name: "mock-metrics"
    honor_labels: true
    static_configs:
      - targets: ["mock-metrics:8080"]

  # Real Production Microservices
  - job_name: "ecommerce-ui"
    metrics_path: /metrics
    static_configs:
      - targets: ["ecommerce-ui:4000", "host.docker.internal:4000", "localhost:4000"]

  - job_name: "product-catalog"
    metrics_path: /metrics
    static_configs:
      - targets: ["product-catalog:3001", "host.docker.internal:3001", "localhost:3001"]

  - job_name: "product-inventory"
    metrics_path: /metrics
    static_configs:
      - targets: ["product-inventory:3002", "host.docker.internal:3002", "localhost:3002"]

  - job_name: "shipping-and-handling"
    metrics_path: /metrics
    static_configs:
      - targets: ["shipping-and-handling:8080", "host.docker.internal:8080", "localhost:8080"]

  - job_name: "contact-support"
    metrics_path: /metrics
    static_configs:
      - targets: ["contact-support-team:8000", "contact-support:8000", "host.docker.internal:8000", "localhost:8000"]

  - job_name: "order-management"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-management:9090", "host.docker.internal:9090", "localhost:9090"]
