global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "fluent-bit"
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["fluent-bit:2020"]

  # Synthetic Mock Metrics Generator (Preserves individual microservice job labels)
  - job_name: "mock-metrics"
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets: ["mock-metrics:8080", "172.31.3.1:8088", "localhost:8088"]

  # Direct Scrapes for Host / Docker Microservices
  - job_name: "ecommerce-ui"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.3.1:4000", "ecommerce-ui:4000"]
    metric_relabel_configs:
      - source_labels: [route]
        target_label: path
        regex: (.+)
        replacement: $1

  - job_name: "product-catalog"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.3.1:3001", "product-catalog:3001"]
    metric_relabel_configs:
      - source_labels: [route]
        target_label: path
        regex: (.+)
        replacement: $1

  - job_name: "product-inventory"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.3.1:3002", "product-inventory:3002"]

  - job_name: "shipping-and-handling"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.3.1:8080", "shipping-and-handling:8080"]
    metric_relabel_configs:
      - source_labels: [route]
        target_label: path
        regex: (.+)
        replacement: $1

  - job_name: "contact-support"
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.3.1:8000", "contact-support-team:8000"]

  - job_name: "order-management"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["172.31.3.1:9090", "order-management:9090"]
    metric_relabel_configs:
      - source_labels: [uri]
        target_label: path
        regex: (.+)
        replacement: $1
      - source_labels: [status]
        target_label: status_code
        regex: (.+)
        replacement: $1