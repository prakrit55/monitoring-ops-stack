# Run Loki in single-binary mode for simplicity.
# For high-volume production logs, you can switch this to SimpleScalable.
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # Storage configuration mapping to Google Cloud Storage (GCS)
  storage:
    type: gcs
    gcs:
      bucket_name: "loki-logs-k8s-staging-252732"
    bucketNames:
      chunks: "loki-logs-k8s-staging-252732"
      ruler: "loki-logs-k8s-staging-252732"

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

# Define the service account and GKE Workload Identity annotation
serviceAccount:
  create: true
  name: loki-sa
  annotations:
    iam.gke.io/gcp-service-account: "loki-gcs-sa@k8s-staging-252732.iam.gserviceaccount.com"

# Disable memcached results and chunk caching to fit in resource-constrained clusters
resultsCache:
  enabled: false
chunksCache:
  enabled: false
