# ==============================================================================
# Envoy Gateway Configuration (mumbai-gateway-class)
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: default-gateway
  namespace: gateway-system
spec:
  gatewayClassName: mumbai-gateway-class
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: grafana-tls-secret
        kind: Secret
    allowedRoutes:
      namespaces:
        from: All
