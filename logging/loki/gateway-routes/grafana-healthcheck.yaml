# ==============================================================================
# Envoy Gateway BackendTrafficPolicy (Active Health Check for Grafana)
# ==============================================================================
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: grafana-healthcheck
  namespace: monitoring
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: grafana-route
  healthCheck:
    active:
      type: HTTP
      http:
        path: /api/health
        expectedStatuses:
        - 200
      interval: 15s
      timeout: 5s
      unhealthyThreshold: 2
      healthyThreshold: 2
