services:
  # ---------------------------------------------------------------------------
  # 1. Prometheus Server with Recording & Alert Rules
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability-net

  # ---------------------------------------------------------------------------
  # 2. Grafana with Auto-Provisioned Datasources & Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - PROMETHEUS_URL=http://prometheus:9090
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - observability-net

  # ---------------------------------------------------------------------------
  # 3. Node Exporter for Infrastructure Hardware & Host Metrics
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - observability-net

  # ---------------------------------------------------------------------------
  # 4. Synthetic Metrics Generator (RED microservices & K8s attributes)
  # ---------------------------------------------------------------------------
  mock-metrics:
    image: python:3.11-alpine
    container_name: mock-metrics
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mock-metrics:/app:ro
    command: ["python", "/app/generator.py"]
    ports:
      - "${MOCK_METRICS_PORT:-8088}:8080"
    networks:
      - observability-net

networks:
  observability-net:
    driver: bridge
