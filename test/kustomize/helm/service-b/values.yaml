replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/k8s-staging-252732/service-b/service-b
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP

env:
  PORT: "8081"
  OTEL_EXPORTER_OTLP_ENDPOINT: "opentelemetry-collector.monitoring.svc.cluster.local:4318"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
